name: kelimeki
description: >-
  Kelimeki — köşelerden başlayan stratejik Türkçe kelime oyunu (iOS/Android).
  Oyun motoru kelimeki_core paketindedir; mimari kararlar: mobile/CLAUDE.md.
publish_to: none

# Sürüm ayrıca lib/src/config/env.dart'taki appVersion sabitinde tutulur
# (mobile_min_supported_version karşılaştırması için) — release'te ikisi
# BİRLİKTE artırılmalı, bkz. mobile/CLAUDE.md "Sürüm disiplini".
version: 1.0.2+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  # Zaten supabase_flutter'ın transitive bağımlılığı — arkadaş daveti
  # linklerini (kelimeki://davet/...) dinlemek için doğrudan bağımlılığa
  # alındı (FriendInviteInbox); sürüm kısıtı supabase_flutter'ınkiyle uyumlu.
  app_links: ^6.4.1
  # Hesap Ayarları'ndaki profil fotoğrafı değiştirme — yalnızca galeriden
  # seçim (ImageSource.gallery); kamerayla çekim BİLİNÇLİ kapsam dışı (web
  # `<input type="file">` de yalnızca dosya seçtiriyor, kamera izni
  # gerektirmeyen en yakın eşdeğer).
  image_picker: ^1.1.2
  kelimeki_core:
    path: ../kelimeki_core
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  shared_preferences: ^2.5.3
  # Bağlantı durumu — web `useOnlineStatus` (navigator.onLine) portu.
  # Neden gerekli (14 Ağustos 2026, cihaz testi): çevrimdışı kararı önceden
  # bir ağ çağrısının BAŞARISIZ olmasını bekleyerek veriliyordu ve uçak
  # modunda Supabase auth'un token yenileme denemeleri bunu saniyelere
  # çıkarıyordu — kullanıcı "hemen çıkmalı" dedi. Web'de karar anında
  # veriliyor; bu paket portu da aynı hizaya getiriyor.
  connectivity_plus: ^6.1.0
  # Push bildirimleri + Analytics (ROADMAP madde 13, Sürüm B).
  #
  # ⚠ Bu üçü `android/app/google-services.json` OLMADAN DERLENMEZ — dosya
  # repoda (sır değil, APK'nın içinde zaten görünüyor; ayrıntı kök CLAUDE.md).
  #
  # Gönderici TEK: FCM. iOS'a da FCM teslim ediyor (arka planda APNs'i kendisi
  # kullanıyor), yani iOS günü gelince yapılacak iş ikinci bir yol yazmak
  # DEĞİL, yalnızca APNs anahtarını Firebase'e yüklemek + Push capability.
  # Bu yüzden izin akışı da platforma DALLANMIYOR, eklentinin ortak API'sini
  # kullanıyor.
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  # Analytics aynı pakette: FCM için Firebase zaten kuruluyor, olayları o
  # anda açmak neredeyse bedava (26 Ağustos 2026 kullanıcı kararı). Bugünkü
  # şema SONUÇLARI görüyor, DAVRANIŞI görmüyor — ekran görüntülenmesi, akış
  # içi terk noktası, oturum uzunluğu yok.
  firebase_analytics: ^12.5.0
  # "Açılışta yeni sürüm varsa uyar ve yaptır" (30 Ağustos 2026 kullanıcı
  # kararı). Güncelleme olup olmadığını PLAY biliyor — sunucuda sürüm satırı
  # tutmuyoruz; `app_config.mobile_min_supported_version` yalnızca acil fren
  # olarak kaldı. YALNIZCA Android eklentisi ve yalnızca Play'den KURULMUŞ
  # pakette çalışır (bkz. lib/src/data/store_update.dart → sınırlar).
  in_app_update: ^5.0.0
  # Güncelleme ekranındaki mağaza YEDEĞİ için (29 Ağustos 2026) —
  # in_app_update'in çalışmadığı yerde (yan yüklenmiş paket, Play yok) tek
  # çıkış yolu bu. Uygulamanın dış bağlantı AÇTIĞI TEK yer burası; paylaşım
  # işi share_plus'ta ve o bağlantıyı açmıyor, sistem paylaşım sayfasına
  # veriyor.
  url_launcher: ^6.3.1
  sqflite: ^2.4.2
  sqflite_common_ffi_web: ^1.0.2
  supabase_flutter: ^2.10.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Testlerde SQLite'ı masaüstü VM'de koşturur (cihaz/emülatör gerekmez).
  sqflite_common_ffi: ^2.3.6
  # Uygulama ikonu/splash ÜRETİCİLERİ — yalnızca `dart run
  # flutter_launcher_icons`/`flutter_native_splash:create` çalıştırılırken
  # kullanılır, derlenmiş uygulamaya hiç girmez. Kaynak görseller
  # mobile/scripts/generate-app-icon-masters.mjs ile üretilir — bkz.
  # mobile/CLAUDE.md, "Uygulama İkonu / Splash".
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

# ÜRETİCİ YAPILANDIRMASI — kaynak görseller assets/icon/, ikisi de
# mobile/scripts/generate-app-icon-masters.mjs'in çıktısı (elle düzenlenmez).
# `icon-source.png`: opak, tam kanama — iOS AppIcon + Android LEGACY ikon.
# `icon-adaptive-fg.png`: şeffaf, %66 güvenli bölgeye küçültülmüş — Android
# ADAPTIVE ikonun ön katmanı VE splash görseli (ikisi de aynı güvenli-bölge
# kısıtına tabi: Android 12+ splash API'si de dairesel bir maskeyle kırpıyor).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon-source.png
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: assets/icon/icon-adaptive-fg.png

flutter_native_splash:
  color: "#ffffff"
  image: assets/icon/icon-adaptive-fg.png
  android_12:
    image: assets/icon/icon-adaptive-fg.png
    color: "#ffffff"
  android: true
  ios: true
  web: false # web/ ayrı bir TEST ORTAMI (bkz. CLAUDE.md) — elle kurulmuş
             # index.html/CanvasKit ayarlarına dokunmasın diye kapalı.

flutter:
  uses-material-design: true
  assets:
    # ÜRETİLMİŞ (elle düzenlenmez): kaynak src/data/words.ts,
    # `npm run generate-golden-vectors` yeniden üretir. Satır SIRASI
    # sözleşmedir (YZ determinizmi) — bkz. mobile/CLAUDE.md.
    - assets/dictionary/words_tr.txt
    # ÜRETİLMİŞ (elle düzenlenmez): kaynak src/data/meanings.json,
    # `npm run generate-meanings-db` yeniden üretir. Yanındaki .sha256
    # kopyanın tazeliğini 5 MB okumadan doğrular (bkz. meaning_store.dart).
    - assets/dictionary/meanings.db
    - assets/dictionary/meanings.db.sha256
  # Web ile aynı üç aile (tailwind fontFamily): sans=Space Grotesk,
  # mono=Space Mono, tile=Nunito. Google Fonts'tan statik TTF'ler.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
    # YALNIZCA k-lig rütbe rozetinin (rank_seal.dart) ortasındaki harf/rakam.
    # ÜRETİLMİŞ/ALT KÜMELENMİŞ dosya (3.6 MB → 14 KB) — elle düzenlenmez,
    # yeniden üretme komutu kök CLAUDE.md → "Rütbe Rozeti Fontu". Web tarafı
    # AYNI alt kümenin woff2'sini kullanıyor (src/fonts/mplus-rounded-seal.css).
    - family: MPlusRounded1c
      fonts:
        - asset: assets/fonts/MPLUSRounded1c-ExtraBold-subset.ttf
          weight: 800
