<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Setup ekranında (ilk boyama) hemen görünen, en görünür FOUT riski
         taşıyan iki font dosyası — açıklama paragrafı (Space Mono 400) ve
         kalın buton etiketleri (Space Grotesk 700). Bu küçük dosyaların
         CSS'ten bağımsız, hemen ve yüksek öncelikle indirilmesini sağlayıp
         görünür font sıçramasını önler (bkz. src/fonts/space-mono-inline.css
         ve src/fonts/space-grotesk-inline.css'teki notlar). -->
    <link rel="preload" href="/fonts/space-mono-400-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/space-mono-400-normal-latin-ext.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/space-grotesk-700-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/space-grotesk-700-normal-latin-ext.woff2" as="font" type="font/woff2" crossorigin />
    <!-- 1 Ağustos 2026 — GameHeader'daki skor kutuları (font-mono font-bold
         = Space Mono 700) de aynı FOUT riskine giriyordu: dar YZ kutusunda
         fallback fontla kısaca kırpılmış görünüp gerçek font swap'landığında
         düzeliyordu (bkz. src/fonts/space-mono-inline.css'teki not). -->
    <link rel="preload" href="/fonts/space-mono-700-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/space-mono-700-normal-latin-ext.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Supabase isteklerinin (guest_visits vb.) DNS/TLS kurulumunu erkenden başlatır — kritik istek zincirindeki gecikmeyi azaltır -->
    <link rel="preconnect" href="https://xvqlizifakkkoqahaxsg.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://xvqlizifakkkoqahaxsg.supabase.co" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta name="theme-color" content="#0F1C26" />
    <!-- Uygulamanın karanlık teması yok — bunu bildirmezsek Android
         Chrome'un "Zorla Karanlık Tema" özelliği sayfayı otomatik
         (ve tutarsızca) karartıp beyaz zeminleri siyaha çeviriyor. -->
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kelimeki" />
    <meta
      name="description"
      content="2 veya 4 kişi, yapay zekaya ve arkadaşlarına karşı oynanan stratejik bir kelime oyunu — hemen ücretsiz oyna."
    />
    <link rel="canonical" href="https://kelimeki.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kelimeki" />
    <meta property="og:url" content="https://kelimeki.com/" />
    <meta property="og:title" content="Kelimeki - Stratejik Türkçe Kelime Oyunu" />
    <meta
      property="og:description"
      content="Yapay zekaya ve arkadaşlarına karşı, 2 veya 4 kişi oynanan çok farklı bir kelime oyunu."
    />
    <meta property="og:image" content="https://kelimeki.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="tr_TR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kelimeki - Stratejik Türkçe Kelime Oyunu" />
    <meta
      name="twitter:description"
      content="Yapay zekaya ve arkadaşlarına karşı, 2 veya 4 kişi oynanan çok farklı bir kelime oyunu."
    />
    <meta name="twitter:image" content="https://kelimeki.com/og-image.png" />

    <!-- Yazı tipleri uygulamayla birlikte paketlenir, Google'a çağrı yok (src/main.tsx) -->
    <title>Kelimeki, Türkçe stratejik kelime oyunu.</title>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Kelimeki",
        "url": "https://kelimeki.com/",
        "description": "TDK sözlüğüne dayalı, 2 veya 4 kişi yapay zekaya ve arkadaşlarına karşı oynanan stratejik bir Türkçe kelime oyunu.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "inLanguage": "tr",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "TRY"
        }
      }
    </script>
  </head>
  <body>
    <!-- Bu blok yalnızca JS ÇALIŞMAZSA görünür — normal kullanıcı
         deneyimini hiç etkilemez, gerçek JS'siz bir ziyaretçiye (ya da
         Bing gibi JS'i güvenilir çalıştırmayan bir crawler'a) "JavaScript
         gerekiyor" der.

         ⚠ 18 Ağustos 2026'ya kadar burada bir `<h1>` vardı — o tarihte
         gerekçe ARTIK GEÇERSİZ oldu: `<h1>` "ham HTML'de hiç statik metin
         yok, içerik yok sanılıyor" (1 Ağustos 2026, Bing Webmaster Tools)
         korkusuyla eklenmişti, ama aynı gün eklenen karşılama katmanı
         (bkz. `src/landing/`, kök `CLAUDE.md` → "Karşılama Katmanı") ham
         HTML'e GERÇEK ~712 kelimelik bir metin gövdesi ve KENDİ `<h1>`'ini
         (LogoMark'ın sr-only başlığı) getirdi. İki `<h1>` aynı anda ham
         HTML'de duruyordu — crawler'a aynı iddianın iki farklı ifadesini
         (biri "…Kelime Bulmaca Oyunu", biri "…Kelime Oyunu") gösteriyordu.
         Bu blok `<p>`ye indirildi; artık sayfada TEK `<h1>` var. -->
    <noscript>
      <div style="max-width: 600px; margin: 48px auto; padding: 0 20px; font-family: sans-serif; color: #1B2430; text-align: center;">
        <p style="font-size: 1.4em; font-weight: 700; margin: 0 0 12px;">Kelimeki — Ücretsiz Online Türkçe Stratejik Kelime Oyunu</p>
        <p>2 veya 4 kişi, yapay zekaya ve arkadaşlarına karşı oynanan stratejik bir Türkçe kelime oyunu. Kelimeki'yi oynamak için tarayıcınızda JavaScript'i etkinleştirmeniz gerekiyor.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
