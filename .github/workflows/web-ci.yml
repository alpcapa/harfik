# Web CI — lint + build + Playwright duman testleri.
#
# NEDEN VAR (18 Ağustos 2026): `mobile-build.yml` yalnızca Flutter portunu
# kapsıyor; web tarafında (`npm run lint`/`build`/`test`) HİÇBİR otomatik
# kontrol yoktu — bu proje aylardır yalnızca geliştirme oturumunda elle
# koşulan komutlara güveniyordu. Bu, karşılama katmanı (bkz. kök `CLAUDE.md`
# → "Karşılama Katmanı") eklendiğinden beri özellikle riskli: dolaşımdaki
# `/game/:id` ve `/davet/:token` bağlantılarının kırılmadığını kanıtlayan
# TEK şey `tests/smoke.spec.ts`teki duman testleri, ve onları hiçbir otomatik
# kontrol koşturmuyordu — `<head>`'e enjekte edilen kapı script'inde
# (`scripts/landing-plugin.js`) tek satırlık bir regresyon sessizce merge
# edilebilirdi.
#
# TETİKLEYİCİ: yalnızca web'i ilgilendiren dosyalar değiştiğinde (mobil
# port kendi workflow'unda kapsanıyor, `mobile/**` burada YOK).
#
# ⚠ İKİNCİ İŞ — `parite` (2 Eylül 2026'da eklendi, GERÇEK BİR VAKADAN):
# `mobile-build.yml` yalnızca `mobile/**` değişince tetikleniyor. Ama mobil
# testlerin bir bölümü web KAYNAK DOSYALARINI OKUYOR (`readRepoFile`,
# `test/support/web_source.dart`) — ör. `layout_parity_test.dart`,
# `GameOver.tsx`teki `w-[29px]` sınıfından sayıyı çekip portun
# `_ColHeader(width: 29)`'uyla karşılaştırıyor. Yani SAF BİR WEB PR'I bir
# mobil testi düşürebilir ve HİÇBİR kontrol bunu görmez.
# Olan tam olarak buydu: PR #401 o sınıfları ızgaraya çevirdi, iki PR ayrı
# ayrı yeşildi, `main` merge'den SONRA kırmızıya döndü (697 geçti, 1 düştü).
# Bu iş o deliği kapatıyor: web dosyaları değişince mobil test paketi de
# koşuyor.
#
# NEDEN TAMAMI, "yalnızca parite testleri" DEĞİL: hangi testin web dosyası
# okuduğunu grep'le seçmek kırılgan — desen kayarsa seçim SESSİZCE boşalır
# ve iş yeşil kalır (bu depoda kayıtlı en kötü CI arızası tipi: kırmızı
# değil, HİÇ ÇALIŞMAYAN kontrol). Tam paket ~2 dk sürüyor, `test` işiyle
# PARALEL koşuyor, yani duvar saatine maliyeti yok.
#
# ⚠ `paths` LİSTESİ BU İŞİN DE KAPSAMI. Mobil testlerin okuduğu depo
# dosyaları (2 Eylül 2026'da sayıldı): `src/**` (13 bileşen/util),
# `scripts/verify-error-reporting.ts`, `supabase/migrations/**`,
# `tailwind.config.js` — dördü de yukarıdaki listede VAR. Mobil testlere
# `mobile/` DIŞINDAN yeni bir dosya okutulursa o yolun burada karşılığı
# olduğundan emin ol, yoksa delik yeniden açılır.
#
# SÜRÜM NOTU (18 Ağustos 2026): action'lar Node 20 tabanlı `@v4`lerden
# çıkarıldı — GitHub runner'ları Node 20'yi kullanımdan kaldırıyor ve her
# koşuda "Node.js 20 is deprecated … forced to run on Node.js 24" uyarısı
# üretiyordu (runner zaten Node 24'te çalıştırıyordu, yani davranış değil
# yalnızca uyarı değişti). Yükseltmeden ÖNCE kırıcı değişiklikler okundu:
# checkout v7 yalnızca `pull_request_target`/`workflow_run` ile tetiklenen
# FORK PR'larında checkout'u reddediyor — buradaki tetikleyiciler `push` ve
# `pull_request`, etkilenmiyor. upload-artifact v5-v7 temel girdileri
# (name/path/retention-days/if-no-files-found) değiştirmiyor. setup-node
# v5'ten beri `packageManager` varsa otomatik npm önbelleği açıyor; burada
# `cache: 'npm'` zaten AÇIKÇA yazılı, davranış aynı.
name: Web CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'supabase/migrations/**'
      - 'tests/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tailwind.config.js'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'supabase/migrations/**'
      - 'tests/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tailwind.config.js'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      # React hook sırası: erken `return`den SONRA hook yok. `tsc` bunu
      # göremez ve bu repoda ESLint (react-hooks/rules-of-hooks) yok —
      # 3 Eylül 2026'da LiveGamesTab'a eklenen bir hook `if (creating)`
      # dalının ALTINA düşüp CANLIDA React #300 üretti. Milisaniyeler.
      - run: npm run verify-hook-order

      # Saf fonksiyon kontrolü: "Kalan Taşlar" dökümü ile oyun sonu raf
      # düşümü arasındaki değişmez (bkz. kök `CLAUDE.md` → "Kalan Taşlar").
      # Playwright'a gerek yok, saniyeler sürüyor — lint'in hemen yanında.
      - run: npm run verify-remaining-tiles

      # İstemci hata telemetrisinin karar mantığı (ROADMAP #3): tekrar
      # bastırma, hız sınırı, "beklenen durumu kaydetme" filtresi. Duman
      # testiyle sınanamıyor — modül yalnızca Supabase yapılandırılmışken
      # çalışıyor, dev sunucusunda yapılandırılmamış.
      - run: npm run verify-error-reporting

      # Canlı oyun listesinin "geçici ağ hatası ↔ gerçekten boş" ayrımı ve
      # sessiz yeniden deneme (21 Ağustos 2026 vakası). Duman testiyle
      # sınanamıyor: bu kod yolu oturum açmış bir kullanıcı istiyor, dev
      # sunucusunda Supabase yapılandırılmadığından tarayıcıda ulaşılamıyor.
      - run: npm run verify-live-games-load

      # Girişte hangi sekmenin açılacağı kuralı web'de TS, portta Dart —
      # iki elle senkron kopya. Dart tarafı bir golden tabloya karşı
      # sınanıyor (`mobile/app/test/initial_main_view_parity_test.dart`).
      # Golden ÜRETİLMİŞ bir dosya, yani TS kuralı değişip golden yeniden
      # üretilmezse Dart testi ESKİ tabloya karşı geçerdi. Bu adım o deliği
      # kapatıyor: üreticiyi koşup dosyanın tazeliğini zorluyor.
      # k-lig kademe/ödül tablosu ÜÇ KOPYA elle senkron (SQL ↔ TS ↔ Dart).
      # TS ↔ Dart yarısı portun `rank_tiers_parity_test.dart`ı ile kilitli;
      # bu adım SQL yarısını kilitliyor — geçerli tanımı taşıyan migration'ı
      # ada göre bulup `(values ...)` listelerini TS tablosuyla karşılaştırır.
      # ⚠ Bu yüzden `paths` listesinde `supabase/migrations/**` de var:
      # yalnızca migration değişen bir PR'da da koşmak ZORUNDA.
      - run: npm run verify-league-tiers

      - run: npm run generate-initial-main-view-golden
      - name: Golden tazeliği (initial_main_view)
        run: |
          if ! git diff --quiet -- mobile/app/test/goldens/initial_main_view.json; then
            echo "::error::decideInitialMainView kuralı değişmiş ama golden yeniden üretilmemiş."
            echo "Düzeltme: npm run generate-initial-main-view-golden && git add mobile/app/test/goldens"
            git diff -- mobile/app/test/goldens/initial_main_view.json
            exit 1
          fi

      - run: npm run build

      # Bu ortamdaki geliştirme oturumunun aksine (bkz. playwright.config.ts),
      # runner'da Chromium önceden kurulu değil — burada kendi tarayıcısını
      # kuruyor. `--with-deps` sistem kütüphanelerini de (fontconfig vb.)
      # yükler, aksi halde Chromium ubuntu-latest'te başlamadan patlar.
      - run: npx playwright install --with-deps chromium

      - run: npm run test
        env:
          CI: true

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Web kaynağını OKUYAN mobil testler (yukarıdaki başlık notuna bkz.).
  # `test` işinden bağımsız ve paralel: Node'a da npm'e de ihtiyacı yok.
  parite:
    name: Mobil parite testleri (web kaynağını okuyanlar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # `mobile-build.yml`in "Uygulama analiz + testleri" adımıyla AYNI
      # komut — ikisi ayrışmasın diye bilerek birebir. Analiz burada YOK:
      # bu iş web değişikliğinin mobil tarafta ne kırdığını arıyor, Dart
      # kodunun kendi statik analizi mobil workflow'un sorumluluğunda.
      - name: Mobil test paketi
        working-directory: mobile/app
        run: |
          flutter pub get
          flutter test
