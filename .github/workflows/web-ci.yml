# Web CI — lint + build + Playwright duman testleri.
#
# NEDEN VAR (18 Ağustos 2026): `mobile-build.yml` yalnızca Flutter portunu
# kapsıyor; web tarafında (`npm run lint`/`build`/`test`) HİÇBİR otomatik
# kontrol yoktu — bu proje aylardır yalnızca geliştirme oturumunda elle
# koşulan komutlara güveniyordu. Bu, karşılama katmanı (bkz. kök `CLAUDE.md`
# → "Karşılama Katmanı") eklendiğinden beri özellikle riskli: dolaşımdaki
# `/game/:id` ve `/davet/:token` bağlantılarının kırılmadığını kanıtlayan
# TEK şey `tests/smoke.spec.ts`teki duman testleri, ve onları hiçbir otomatik
# kontrol koşturmuyordu — `<head>`'e enjekte edilen kapı script'inde
# (`scripts/landing-plugin.js`) tek satırlık bir regresyon sessizce merge
# edilebilirdi.
#
# TETİKLEYİCİ: yalnızca web'i ilgilendiren dosyalar değiştiğinde (mobil
# port kendi workflow'unda kapsanıyor, `mobile/**` burada YOK).
# SÜRÜM NOTU (18 Ağustos 2026): action'lar Node 20 tabanlı `@v4`lerden
# çıkarıldı — GitHub runner'ları Node 20'yi kullanımdan kaldırıyor ve her
# koşuda "Node.js 20 is deprecated … forced to run on Node.js 24" uyarısı
# üretiyordu (runner zaten Node 24'te çalıştırıyordu, yani davranış değil
# yalnızca uyarı değişti). Yükseltmeden ÖNCE kırıcı değişiklikler okundu:
# checkout v7 yalnızca `pull_request_target`/`workflow_run` ile tetiklenen
# FORK PR'larında checkout'u reddediyor — buradaki tetikleyiciler `push` ve
# `pull_request`, etkilenmiyor. upload-artifact v5-v7 temel girdileri
# (name/path/retention-days/if-no-files-found) değiştirmiyor. setup-node
# v5'ten beri `packageManager` varsa otomatik npm önbelleği açıyor; burada
# `cache: 'npm'` zaten AÇIKÇA yazılı, davranış aynı.
name: Web CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tailwind.config.js'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'tailwind.config.js'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      # Saf fonksiyon kontrolü: "Kalan Taşlar" dökümü ile oyun sonu raf
      # düşümü arasındaki değişmez (bkz. kök `CLAUDE.md` → "Kalan Taşlar").
      # Playwright'a gerek yok, saniyeler sürüyor — lint'in hemen yanında.
      - run: npm run verify-remaining-tiles

      # İstemci hata telemetrisinin karar mantığı (ROADMAP #3): tekrar
      # bastırma, hız sınırı, "beklenen durumu kaydetme" filtresi. Duman
      # testiyle sınanamıyor — modül yalnızca Supabase yapılandırılmışken
      # çalışıyor, dev sunucusunda yapılandırılmamış.
      - run: npm run verify-error-reporting

      - run: npm run build

      # Bu ortamdaki geliştirme oturumunun aksine (bkz. playwright.config.ts),
      # runner'da Chromium önceden kurulu değil — burada kendi tarayıcısını
      # kuruyor. `--with-deps` sistem kütüphanelerini de (fontconfig vb.)
      # yükler, aksi halde Chromium ubuntu-latest'te başlamadan patlar.
      - run: npx playwright install --with-deps chromium

      - run: npm run test
        env:
          CI: true

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
